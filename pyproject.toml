[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsealed-mcp"
version = "0.1.0"
description = "MCP server exposing CloudSealed's billing-waste anomaly detector and architecture risk scorer as tools for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Martinez Pinto" }]
keywords = ["mcp", "model-context-protocol", "finops", "cloud-cost", "architecture-risk", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "cloudsealed-jit>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.24"]

[project.scripts]
cloudsealed-mcp = "cloudsealed_mcp.server:main"

[project.urls]
Homepage = "https://github.com/cloudsealed/cloudsealed-mcp"
Source = "https://github.com/cloudsealed/cloudsealed-mcp"
Issues = "https://github.com/cloudsealed/cloudsealed-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
